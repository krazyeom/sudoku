<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Sudoku 3x3 Outer Box Glow -->
  <rect x="96" y="96" width="320" height="320" rx="20" fill="#0f172a" fill-opacity="0.8" stroke="url(#gridGlow)" stroke-width="6" filter="url(#glow)"/>

  <!-- Inner Sub-grid Lines -->
  <line x1="202" y1="96" x2="202" y2="416" stroke="#334155" stroke-width="4" stroke-dasharray="2 4"/>
  <line x1="310" y1="96" x2="310" y2="416" stroke="#334155" stroke-width="4" stroke-dasharray="2 4"/>
  <line x1="96" y1="202" x2="416" y2="202" stroke="#334155" stroke-width="4" stroke-dasharray="2 4"/>
  <line x1="96" y1="310" x2="416" y2="310" stroke="#334155" stroke-width="4" stroke-dasharray="2 4"/>

  <!-- Major Cross Lines -->
  <line x1="202" y1="96" x2="202" y2="416" stroke="#475569" stroke-width="3"/>
  <line x1="310" y1="96" x2="310" y2="416" stroke="#475569" stroke-width="3"/>
  <line x1="96" y1="202" x2="416" y2="202" stroke="#475569" stroke-width="3"/>
  <line x1="96" y1="310" x2="416" y2="310" stroke="#475569" stroke-width="3"/>

  <!-- Sudoku Numbers -->
  <text x="149" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#38bdf8" text-anchor="middle">9</text>
  <text x="363" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#e2e8f0" text-anchor="middle">4</text>
  <text x="149" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#e2e8f0" text-anchor="middle">7</text>
  <text x="363" y="386" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#a855f7" text-anchor="middle">5</text>

  <!-- Central Battle Swords Motif -->
  <g transform="translate(256, 256)">
    <!-- Sword 1 -->
    <path d="M-42,-42 L42,42 M-30,-42 L-42,-30 L-20,-8 L-8,-20 Z M32,32 L46,46 M26,38 L38,26" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Sword 2 -->
    <path d="M42,-42 L-42,42 M30,-42 L42,-30 L20,-8 L8,-20 Z M-32,32 L-46,46 M-26,38 L-38,26" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <!-- Spark center -->
    <circle cx="0" cy="0" r="10" fill="#ffffff" filter="url(#glow)"/>
  </g>
</svg>
